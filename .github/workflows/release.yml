# Veröffentlicht ein GitHub Release mit dem Installations-ZIP, sobald main eine Plugin-Version trägt,
# zu der es noch kein Release gibt. Installierte Seiten finden es über den Plugin Update Checker.
#
# Läuft auch bei einem gepushten Tag vX.Y.Z, einem auf GitHub veröffentlichten Release und
# von Hand unter Actions > Release > Run workflow.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Version prüfen
        id: version
        run: |
          version=$(sed -n 's/^ \* Version:[[:space:]]*//p' mlab-forms.php | tr -d '[:space:]')
          pushed=""
          if [ "${{ github.ref_type }}" = "tag" ] || [ -n "${{ github.event.release.tag_name }}" ]; then
            pushed="${{ github.event.release.tag_name || github.ref_name }}"
          fi
          bin/check-version.sh $pushed
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Vorhandenes Release suchen
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --json assets --jq '.assets[].name' 2>/dev/null \
            | grep -qx "mlab-forms.zip"; then
            echo "Release ${{ steps.version.outputs.tag }} hat sein ZIP bereits."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ZIP bauen und prüfen
        if: steps.existing.outputs.done != 'true'
        run: |
          bin/build-zip.sh
          # Übergang: Version 0.3.0 erkennt Updates nur an Dateien namens mlab-forms-<version>.zip.
          cp dist/mlab-forms.zip "dist/mlab-forms-${{ steps.version.outputs.version }}.zip"

      - name: Release-Notizen aus CHANGELOG.md
        if: steps.existing.outputs.done != 'true'
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            /^= / { if (found) exit; if ($0 == "= " v " =") { found=1; next } }
            found' CHANGELOG.md > notes.md

      - name: Release anlegen oder ergänzen
        if: steps.existing.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          files=(dist/mlab-forms.zip "dist/mlab-forms-${{ steps.version.outputs.version }}.zip")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          fi
