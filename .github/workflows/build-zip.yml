name: Plugin-ZIP bauen

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --no-progress

      - name: PHPCS (WordPress Coding Standards)
        run: vendor/bin/phpcs

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: PHPUnit
        run: vendor/bin/phpunit

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: PHP-Syntax prüfen
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Versionen prüfen
        run: bin/check-version.sh ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: ZIP bauen
        id: zip
        run: echo "path=$(bin/build-zip.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: mlab-forms
          path: build/

      - name: ZIP an das Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.path }}
