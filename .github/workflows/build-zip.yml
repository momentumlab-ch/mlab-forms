name: Plugin-ZIP bauen

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  # «Run workflow» auf main legt das Release vX.Y.Z zur Version im Plugin-Header an.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --no-progress

      - name: PHPCS (WordPress Coding Standards)
        run: vendor/bin/phpcs

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

      - name: PHPUnit
        run: vendor/bin/phpunit

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: PHP-Syntax prüfen
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Versionen prüfen
        run: bin/check-version.sh ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: ZIP bauen
        id: zip
        run: |
          echo "path=$(bin/build-zip.sh)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^ \* Version: *//p' mlab-forms.php | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: mlab-forms
          path: build/

      - name: ZIP an das Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.path }}

      - name: Release anlegen (manuell gestartet)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.zip.outputs.version }}
          name: ${{ steps.zip.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.zip.outputs.path }}
